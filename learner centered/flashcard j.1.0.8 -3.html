<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessible Flash Cards</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: #fff;
      color: #0f172a;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 18px;
    }

    .card {
      width: min(300px, 85vw);
      height: min(180px, 55vw);
      min-height: 150px;
      margin: 0 auto 20px;
      perspective: 1000px;
      cursor: pointer;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #fff;
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-size: clamp(18px, 6vw, 24px);
      padding: 16px;
      overflow-wrap: anywhere;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #f1f5f9;
    }

    .card.slide-from-left {
      animation: slideFromLeft 0.45s ease-out;
    }

    .card.slide-from-right {
      animation: slideFromRight 0.45s ease-out;
    }

    @keyframes slideFromLeft {
      0% { opacity: 0; transform: translateX(-100%) rotate(-10deg); }
      60% { opacity: 1; transform: translateX(15%) rotate(3deg); }
      100% { opacity: 1; transform: translateX(0) rotate(0); }
    }

    @keyframes slideFromRight {
      0% { opacity: 0; transform: translateX(100%) rotate(10deg); }
      60% { opacity: 1; transform: translateX(-15%) rotate(-3deg); }
      100% { opacity: 1; transform: translateX(0) rotate(0); }
    }

    button {
      min-width: 100px;
      min-height: 44px;
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:focus-visible,
    .card:focus-visible,
    #cardSlider:focus-visible {
      outline: 3px solid #fbbf24;
      outline-offset: 3px;
    }

    #indexButton {
      background: #64748b;
      margin-bottom: 15px;
    }

    #indexButton:hover {
      background: #475569;
    }

    #modeButton {
      background: #7c3aed;
      margin-bottom: 15px;
    }

    #modeButton:hover {
      background: #6d28d9;
    }

    #progressText {
      margin: 15px 0 5px;
      color: #475569;
      font-size: 14px;
    }

    #cardSlider {
      width: min(300px, 85vw);
      height: 30px;
      margin-top: 10px;
      cursor: pointer;
      accent-color: #3b82f6;
    }

    .multiple-choice-options {
      width: min(300px, 85vw);
      margin: 0 auto 10px;
      display: grid;
      gap: 8px;
    }

    .multiple-choice-options button {
      width: 100%;
      margin: 0;
      background: #fff;
      color: #0f172a;
      border: 2px solid #3b82f6;
      text-align: left;
    }

    .multiple-choice-options button:hover {
      background: #eff6ff;
    }

    .multiple-choice-options button.correct {
      background: #15803d;
      border-color: #15803d;
      color: white;
    }

    .multiple-choice-options button.incorrect {
      background: #b91c1c;
      border-color: #b91c1c;
      color: white;
    }

    .choice-feedback {
      min-height: 24px;
      margin: 8px 0;
      font-weight: bold;
    }

    .instructions {
      margin-top: 18px;
      color: #475569;
      font-size: 13px;
      line-height: 1.5;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-inner {
        transition: none;
      }

      .card.slide-from-left,
      .card.slide-from-right {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <button type="button" id="indexButton">
      Back to menu
    </button>

    <button type="button" id="modeButton" aria-pressed="false">
      Multiple Choice: Off
    </button>

    <div
      class="card"
      id="card"
      tabindex="0"
      role="button"
      aria-label="Flashcard. Tap to flip, swipe left or right to change cards, or swipe up to flip."
    >
      <div class="card-inner">
        <div class="card-front" id="question"></div>
        <div class="card-back" id="answer"></div>
      </div>
    </div>

    <div
      id="multipleChoiceOptions"
      class="multiple-choice-options"
      hidden
    ></div>

    <p id="choiceFeedback" class="choice-feedback" aria-live="polite"></p>

    <div class="controls">
      <button type="button" id="previousButton">Previous</button>
      <button type="button" id="nextButton">Next</button>
    </div>

    <p id="progressText" aria-live="polite">Card 1 of 1</p>

    <label for="cardSlider" class="visually-hidden">
      Navigate flashcards
    </label>

    <input
      type="range"
      id="cardSlider"
      min="0"
      max="0"
      value="0"
      step="1"
      aria-label="Navigate flashcards"
    />

    <p class="instructions">
      Tap the card to flip and reveal the answer.<br />
      Swipe left for next or right for previous.<br />
      Use Multiple Choice mode to answer with choices.
    </p>
  </main>

  <script>
  const flashcards = [
  {
    question: "What does the Atkinson–Shiffrin model describe?",
    answer: "How information moves through sensory, working, and long-term memory."
  },
  {
    question: "What is sensory memory?",
    answer: "A brief store of information from the senses."
  },
  {
    question: "What moves information from sensory memory to working memory?",
    answer: "Attention."
  },
  {
    question: "What is working memory?",
    answer: "The limited-capacity space where we hold and process information we are currently thinking about."
  },
  {
    question: "What is long-term memory?",
    answer: "A store of knowledge and skills that can last over time."
  },
  {
    question: "What is cognitive load?",
    answer: "The mental effort needed to process information."
  },
  {
    question: "What is intrinsic cognitive load?",
    answer: "The difficulty that comes from the material itself and the learner’s knowledge of it."
  },
  {
    question: "What is extraneous cognitive load?",
    answer: "Unnecessary mental effort caused by confusing presentation or distractions."
  },
  {
    question: "What is germane processing?",
    answer: "Mental effort used to organize and connect information into lasting knowledge."
  },
  {
    question: "What are the three metacognitive regulation steps?",
    answer: "Planning, monitoring, and evaluating."
  },
  {
    question: "What does planning involve?",
    answer: "Setting a learning goal and choosing a strategy before starting."
  },
  {
    question: "What does monitoring involve?",
    answer: "Checking your understanding while learning."
  },
  {
    question: "What does evaluating involve?",
    answer: "Reflecting on whether your strategy worked and what to change next time."
  },
  {
	question: "What is constructivism?",
    answer: "The view that learners actively build understanding by connecting new experiences and information to what they already know."
  },
  {
    question: "What is radical constructivism?",
    answer: "The view that individuals construct their own understanding from experience; knowledge is not simply a direct copy of an objective reality."
  },
  {
    question: "What is social constructivism?",
    answer: "The view that knowledge is constructed through social interaction, language, culture, and collaboration."
  },
  {
    question: "What is a key difference between radical and social constructivism?",
    answer: "Radical constructivism emphasizes the individual's construction of understanding; social constructivism emphasizes how interaction and culture shape learning."
  },
  {
    question: "What is a Constructivist Learning Environment (CLE)?",
    answer: "A learning environment where students actively build understanding through meaningful tasks, inquiry, reflection, and collaboration."
  },
  {
    question: "What kinds of tasks are used in a CLE?",
    answer: "Authentic, meaningful tasks connected to real-world situations or complex problems."
  },
  {
    question: "How does a CLE support different perspectives?",
    answer: "It presents ideas in multiple ways and encourages learners to consider different viewpoints and possible solutions."
  },
  {
    question: "How do students learn together in a CLE?",
    answer: "They discuss, share reasoning, and negotiate meaning to build knowledge collaboratively."
  },
  {
    question: "What is the teacher’s role in a CLE?",
    answer: "To guide learning by modeling, coaching, asking questions, and providing scaffolding when needed."
  },
  {
    question: "What is conceptual change?",
    answer: "A process in which learners revise or reorganize their existing ideas to develop a more accurate or useful understanding."
  },
  {
    question: "Why does prior knowledge matter in conceptual change?",
    answer: "Learners interpret new information through what they already believe and know."
  },
  {
    question: "What is assimilation?",
    answer: "Interpreting new information using an existing mental framework without substantially changing it."
  },
  {
    question: "What is accommodation?",
    answer: "Changing an existing mental framework, or creating a new one, to make sense of new information."
  },
  {
    question: "How can a teacher support conceptual change?",
    answer: "Elicit students’ initial ideas, invite them to test those ideas with evidence, guide discussion, and help them apply a revised understanding."
  },
  {
	question: "What is the main idea of humanistic learning theory?",
    answer: "Learning should support the whole person, including their feelings, needs, choices, and personal growth."
  },
  {
    question: "What is Carl Rogers’ idea in Freedom to Learn?",
    answer: "Students learn meaningfully when they take an active role in learning that feels relevant to them; the teacher facilitates rather than simply directs."
  },
  {
    question: "What does genuineness mean for a facilitator?",
    answer: "Being authentic and sincere with learners."
  },
  {
    question: "What does acceptance mean for a facilitator?",
    answer: "Valuing learners without judgment and showing unconditional positive regard."
  },
  {
    question: "What does empathy mean for a facilitator?",
    answer: "Trying to understand a learner’s experiences and feelings from their perspective."
  },
  {
    question: "What are the three facilitator traits associated with Rogers?",
    answer: "Genuineness, acceptance, and empathy."
  },
  {
    question: "What is Maslow’s hierarchy of needs?",
    answer: "A model suggesting that human needs motivate behavior, from basic survival needs toward personal growth."
  },
  {
    question: "What are the five levels of Maslow’s hierarchy, from lowest to highest?",
    answer: "Physiological needs, safety, love and belonging, esteem, and self-actualization."
  },
  {
    question: "What are physiological needs?",
    answer: "Basic physical needs such as food, water, rest, and warmth."
  },
  {
    question: "What are safety needs in a classroom?",
    answer: "Feeling physically and emotionally safe, with predictable expectations and freedom from threats or ridicule."
  },
  {
    question: "What are belonging needs at school?",
    answer: "Feeling accepted, included, and connected to teachers and peers."
  },
  {
    question: "What are esteem needs in learning?",
    answer: "Feeling capable, respected, and valued for one’s effort and progress."
  },
  {
    question: "What is self-actualization?",
    answer: "Pursuing personal growth, creativity, and one’s potential."
  },
  {
    question: "How can unmet needs affect a child’s readiness to learn?",
    answer: "Hunger, fatigue, feeling unsafe, or exclusion can make it harder to focus, participate, and stay motivated."
  },
  {
    question: "What classroom actions can support children’s readiness to learn?",
    answer: "Support basic comfort, create a safe and predictable environment, foster belonging, and recognize effort and progress."
  },
  {
    question: "Should Maslow’s hierarchy be treated as a strict sequence?",
    answer: "No. It is a useful framework, but needs can overlap, and children may learn even when some needs are unmet."
  }
];

    let currentCard = 0;
    let multipleChoiceMode = false;

    const indexButton = document.getElementById("indexButton");
    const card = document.getElementById("card");
    const question = document.getElementById("question");
    const answer = document.getElementById("answer");
    const progressText = document.getElementById("progressText");
    const cardSlider = document.getElementById("cardSlider");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const modeButton = document.getElementById("modeButton");
    const multipleChoiceOptions =
      document.getElementById("multipleChoiceOptions");
    const choiceFeedback = document.getElementById("choiceFeedback");

    cardSlider.max = flashcards.length - 1;

    indexButton.addEventListener("click", () => {
      window.location.href = "../index.html";
    });

    function shuffle(array) {
      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[randomIndex]] =
          [shuffled[randomIndex], shuffled[i]];
      }

      return shuffled;
    }

    function createMultipleChoiceOptions() {
      const correctAnswer = flashcards[currentCard].answer;

      const otherAnswers = flashcards
        .filter((flashcard, index) => {
          return (
            index !== currentCard &&
            flashcard.answer !== correctAnswer
          );
        })
        .map((flashcard) => flashcard.answer);

      const incorrectAnswers = shuffle(otherAnswers).slice(0, 3);

      const choices = shuffle([
        correctAnswer,
        ...incorrectAnswers
      ]);

      multipleChoiceOptions.innerHTML = "";
      choiceFeedback.textContent = "";

      choices.forEach((choice) => {
        const button = document.createElement("button");

        button.type = "button";
        button.textContent = choice;
        button.dataset.answer = choice;
        button.setAttribute("aria-label", `Answer: ${choice}`);

        button.addEventListener("click", () => {
          checkAnswer(button, correctAnswer);
        });

        multipleChoiceOptions.appendChild(button);
      });
    }

    function checkAnswer(selectedButton, correctAnswer) {
      const choiceButtons =
        multipleChoiceOptions.querySelectorAll("button");

      choiceButtons.forEach((button) => {
        button.disabled = true;

        if (button.dataset.answer === correctAnswer) {
          button.classList.add("correct");
        }
      });

      if (selectedButton.dataset.answer === correctAnswer) {
        choiceFeedback.textContent = "Correct!";
        choiceFeedback.style.color = "#4ade80";
      } else {
        selectedButton.classList.add("incorrect");

        choiceFeedback.textContent =
          `Incorrect. The correct answer is: ${correctAnswer}`;

        choiceFeedback.style.color = "#f87171";
      }
    }

    function updateCard(animationClass = "") {
      card.classList.remove("flipped");
      card.classList.remove("slide-from-left", "slide-from-right");

      void card.offsetWidth;

      if (animationClass) {
        card.classList.add(animationClass);
      }

      question.textContent =
        `${currentCard + 1}. ${flashcards[currentCard].question}`;

      answer.textContent = flashcards[currentCard].answer;

      progressText.textContent =
        `Card ${currentCard + 1} of ${flashcards.length}`;

      cardSlider.value = currentCard;

      card.setAttribute(
        "aria-label",
        `Flashcard ${currentCard + 1} of ${flashcards.length}. ` +
        "Tap to flip, swipe left for next, or swipe right for previous."
      );

      if (multipleChoiceMode) {
        multipleChoiceOptions.hidden = false;
        createMultipleChoiceOptions();
      } else {
        multipleChoiceOptions.hidden = true;
        multipleChoiceOptions.innerHTML = "";
        choiceFeedback.textContent = "";
      }
    }

    function flipCard() {
      card.classList.toggle("flipped");
    }

    function nextCard() {
      currentCard = (currentCard + 1) % flashcards.length;
      updateCard("slide-from-right");
    }

    function previousCard() {
      currentCard =
        (currentCard - 1 + flashcards.length) % flashcards.length;

      updateCard("slide-from-left");
    }

    modeButton.addEventListener("click", () => {
      multipleChoiceMode = !multipleChoiceMode;

      modeButton.setAttribute(
        "aria-pressed",
        String(multipleChoiceMode)
      );

      modeButton.textContent = multipleChoiceMode
        ? "Multiple Choice: On"
        : "Multiple Choice: Off";

      updateCard();
    });

    previousButton.addEventListener("click", previousCard);
    nextButton.addEventListener("click", nextCard);

    cardSlider.addEventListener("input", () => {
      currentCard = Number(cardSlider.value);
      updateCard();
    });

    card.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flipCard();
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        previousCard();
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        nextCard();
      }
    });

    let startX = 0;
    let startY = 0;
    let startTime = 0;
    let moved = false;

    card.addEventListener("pointerdown", (event) => {
      startX = event.clientX;
      startY = event.clientY;
      startTime = Date.now();
      moved = false;

      card.setPointerCapture(event.pointerId);
    });

    card.addEventListener("pointermove", (event) => {
      const distanceX = Math.abs(event.clientX - startX);
      const distanceY = Math.abs(event.clientY - startY);

      if (distanceX > 10 || distanceY > 10) {
        moved = true;
      }
    });

    card.addEventListener("pointerup", (event) => {
      const distanceX = event.clientX - startX;
      const distanceY = event.clientY - startY;
      const elapsedTime = Date.now() - startTime;

      const isQuickGesture = elapsedTime <= 800;

      const isHorizontalSwipe =
        Math.abs(distanceX) >= 50 &&
        Math.abs(distanceX) > Math.abs(distanceY);

      const isSwipeUp =
        distanceY <= -50 &&
        Math.abs(distanceY) > Math.abs(distanceX);

      if (isQuickGesture && isHorizontalSwipe) {
        if (distanceX < 0) {
          nextCard();
        } else {
          previousCard();
        }
      } else if (isQuickGesture && isSwipeUp) {
        flipCard();
      } else if (!moved) {
        flipCard();
      }
    });

    card.addEventListener("pointercancel", () => {
      moved = true;
    });

    updateCard();
  </script>
</body>
</html>
